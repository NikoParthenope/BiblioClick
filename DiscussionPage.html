<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="CSS/TabView.css">

<body style="background-image: url(assets/Libri.jpg); background-repeat: no-repeat; background-size: cover;">
    <div class="ElementContentColumn" style="height: 100vh;width:100vw;">

            <div class="Profile">

                <div id="Menu" class="HoverMenu">

                    </div>
                </div>
            </div>
        </nav>
        <div class="ElementContentColumn" style="width:100%;">

            <div class="ElementContentColumn">
                <section id="CommentInput" class="ElementContentRow" style="width:100%;height:25%;">
                    <form id="RispostaCommento" style="width:90%;height:75%;display:flex;justify-content: center;margin-top:0; margin-bottom:20px;">
                        <textarea id="UserComment" style="padding:10px;width:100%;height:100%;" name="Comm" ></textarea>
                        <div class="ElementContentColumn" style="justify-content: flex-end; width:30%;">
                            <input type="submit" value="Invio">

                    </form>
                </section>
                <section class="ElementContentColumn" style="display:flex; justify-content:center;width:100%;height:70%;">
                    <hr style="width: 90%;position:absolute; top:0;">
                    <section id="CommentSection" style="width:90%;height:85%;overflow-y: scroll;">
                        
                        
                            

                        
                    </section>
                </section>
            </div>
            
        </div>
