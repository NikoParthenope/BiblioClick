<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="CSS/UserProfile.css">
</head>
<body>
    <div class="TabView">
        <div class="Tab">
            <div class="UpperTab">
                <h1 style="text-align: center;">BiblioClick</h1>
                <input type="radio" id="DashBoard"name="NavBarProfile" checked="checked">
                <label for="DashBoard">DashBoard</label>
                <input type="radio" id="Security" name="NavBarProfile">
                <label for="Security">I miei dati</label>
            </div>
            <div class="LowerTab">
                <button id="LogoutButton">Logout</button>
            </div>
        </div>
        <div class="Content">
            <div id="DashBoardContent" class="ContenutoTab">
                <div class="ElementContentRow">
                    <div class="ElementContentRow">
                                <div class="InformationContainer ElementContentColumn" style="width: 90%;height: 90%;justify-content: space-around;">
                                    <div class="ElementContentRow" style="width:90%;text-align: center;display:block;"> 
                                        <h1>Miei Club</h1>
                                        <div id="ProfileMyClub" class="ElementContentColumn" style="justify-content: flex-start;">
                                        </div>
                                    </div>

                                </div>
                    </div>
                    <div class="ElementContentRow" style="height:50%;;">
                                        <div class="Calendar">
                                            <div class="CalendarMonth">
                                                <button><</button>
                                                <p id="NOOOOOOOOOOOO" style="width: 100%; text-align: center;color:red;font-weight: bold;"></p>
                                                <button>></button>
                                            </div>
                                            <div id="IndicatorePagina" style="z-index:0;visibility:hidden;align-items:center;display:flex;align-items:center;">
                                                <div class="IndicatorGlass" style="width: 25px;height: 25px;background-color:var(--SystemGray2);"></div>
                                            </div>
                                            <div class="Calendartwo" id="CalendarDaysID">
                                                <div style="font-weight: bold;">L</div>
                                                <div style="font-weight: bold;">M</div>
                                                <div style="font-weight: bold;">M</div>
                                                <div style="font-weight: bold;">G</div>
                                                <div style="font-weight: bold;">V</div>
                                                <div style="font-weight: bold;">S</div>
                                                <div class="Active" style="color:red;font-weight: bold;">D</div>

                                            </div>

                                        </div>
                    </div>
                </div>
            </div>
            <div id="SecurityContent" class="ContenutoTab">
                                <div class="InformationContainer ElementContentColumn" style="width: 90%;height: 90%;justify-content: center;">
                                    <div class="ElementContentRow" style="width:100%;text-align: center;display:block; height: 100%;"> 
                                        <h1 id="ScrittaBenvenuto">Miei Club</h1>
                                        <div class="ElementContentColumn" style="height:auto;">
                                            <div class="ImmagineProfilo"></div>
                                        </div>
                                        <div class="ElementContentColumn" style="height:73%;">
                                            <div style="width:100%;height:100%;">
                                                <div class="SettingsTabs">
                                                    
                                                    <input type="radio" id="SettingsTabsGeneral" name="SettingsTabsInput" checked="checked">
                                                    <label for="SettingsTabsGeneral">Generale</label>
                                                    <div class="ContenutoSettings">
                                                        <form id="GeneralForm">
                                                            <div class="ElementContentRow" style="width:100%;">
                                                            <div style="width:100%;">
                                                                <label for="NomeUtente">Nome</label>
                                                                <input id="NomeUtente" type="text" name="nome">
                                                            </div>

                                                            <div style="width:100%;">
                                                                <label for="CognomeUtente">Cognome</label>
                                                                <input id="CognomeUtente" type="text" name="cognome">
                                                            </div>

                                                            <div style="width:100%;">
                                                                <label for="EmailUtente">eMail</label>
                                                                <input id="EmailUtente" type="text" name="email">
                                                            </div>
                                                            </div>
                                                            <div id="DivConfermaPassword" style="visibility: hidden;">
                                                                <label for="EmailUtente">Confirm New Password</label>
                                                                <input style="width:50%;" id="ConfirmPasswordInput" type="text" name="password">
                                                            </div>
                                                                <input id="SaveButtonUser" value="Salva" type="submit" style="visibility: hidden;">
                                                                <input id="ResetButtonUser" value="Annulla" type="reset">
                                                           
                                                        </form>
                                                    </div>
                                                    <input type="radio" id="SettingsTabSicurezza" name="SettingsTabsInput">
                                                    <label for="SettingsTabSicurezza">Sicurezza</label>

                                                    <div class="ContenutoSettings">
                                                        <form id="GeneralFormPassword">
                                                            <div>
                                                                <label for="OldPasswordInput">Old Password</label>
                                                                <input style="width:50%;" id="OldPasswordInput" type="text" name="OldPassword">
                                                            </div>

                                                            <div>
                                                                <label for="NewPasswordInput">New Password</label>
                                                                <input style="width:50%;" id="NewPasswordInput" type="text" name="NewPassword">
                                                            </div>

                                                            <div>
                                                                <label for="ConfirmPasswordInput">Confirm New Password</label>
                                                                <input style="width:50%;" id="ConfirmPasswordInput" type="text" name="ConfirmPassword">
                                                            </div>
                                                            
                                                            <input id="SaveButtonPassword" value="Salva" type="submit">
                                                            <input id="ResetButtonPassword" value="Annulla" type="reset">
                                                        </form>

                                                       
                                                    </div>
                                                </div>
                                            </div> 
                                        </div>   


                                            
                                            </div>
                                        
                                    </div>

                                </div>
            </div>
        </div>
    </div>
    <script type="module" src="./JS/UserPage.js"></script>
</body>
</html>
