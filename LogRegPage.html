<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="CSS/TabView.css">
    <link rel="stylesheet" href="CSS/LoginRegister.css">
</head>
<body>
    <div id="LoginContainer" style="height:100vh;width:100vw; display:flex; align-items: center;justify-content: center;">
        
        <div id="LoginContainerInf" class="InformationContainer ElementContentColumn" style="width: 30%;height: 60%;">
            <h3 style="position:absolute; top:10px;">Login</h3>
            <form id="LoginForm" style="width:85%;">
            <fieldset>
                
                <input type="text" id="UsernameCredential" name="Username">
                <legend>Username</legend>
            </fieldset>
            <fieldset>
                
                <input type="password" id="PasswordCredential" name="Password">
                <legend>Password</legend>
            </fieldset>
            <div class="ElementContentRow" style="justify-content: flex-end;height:auto;margin:20px;">
                <a>Forgot Password?</a>
            </div>
            <div style="display:flex; justify-content:center;align-items:center;height:25%;">
                <input type="submit" value="Login">
            </div>
            </form>
            <div id="RegisterDiv" style="display:flex; align-items:center;justify-content:center;position:absolute; bottom:20px;">
                <input type="checkbox" id="RegisterSwitcher" style="display:none;">
                <label for="RegisterSwitcher">Don't have an account? Register</label>
            </div>
            

        </div>

        <div id="RegisterContainerInf" class="InformationContainer ElementContentColumn" style="width: 30%;height: 60%;">
            <h3 style="position:absolute; top:10px;">Register</h3>
            <form id="RegisterForm" style="width:85%;">
            <fieldset>
                
                <input type="text" id="UsernameCredential" name="Nome">
                <legend>Nome</legend>
            </fieldset>
            <fieldset>
                
                <input type="text" id="PasswordCredential" name="Cognome">
                <legend>Cognome</legend>
            </fieldset>
                        <fieldset>
                
                <input type="text" id="PasswordCredential" name="Username">
                <legend>Username</legend>
            </fieldset>
                        <fieldset>
                
                <input type="email" id="PasswordCredential" name="Email">
                <legend>Email</legend>
            </fieldset>
                                    <fieldset>
                
                <input type="password" id="PasswordCredential" name="Password" required>
                <legend>Password</legend>
            </fieldset>

            <div style="display:flex; justify-content:center;align-items:center;height:15%;">
                <input type="submit" id="TastoRegistrazione" value="Registra">
            </div>
            </form>
            <div style="display:flex; align-items:center;justify-content:center;position:absolute; bottom:1px;">
                <label for="RegisterSwitcher">Annulla</label>
            </div>


    </div>
    </div>
    <script type="module" src="./JS/LogRegPage.js"></script>
</body>
</html>
